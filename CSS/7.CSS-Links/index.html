<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Css</title>
    <div>
    <style>
      /* unvisited link */
      a:link {
        color: red;
      }

      /* visited link */
      a:visited {
        color: rgb(190, 226, 122);
      }

      /* mouse over link */
      a:hover {
        color: hotpink;
        font-size: 25px;
         }

      /* selected link */
      a:active {
        color: blue;
        
      }
     
    </style>
    </div>
  </head>
  <body>
    <a href="https://www.google.com" target="_blank">Google</a>
  </body>
</html>
